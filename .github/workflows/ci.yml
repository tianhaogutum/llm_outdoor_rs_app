name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock
      PYTHON: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Lint
        run: make lint

      # Seed and tests run even when lint fails, so one red step does not hide the others.
      - name: Seed database
        if: ${{ !cancelled() }}
        run: make seed

      - name: Tests
        if: ${{ !cancelled() }}
        run: make test
