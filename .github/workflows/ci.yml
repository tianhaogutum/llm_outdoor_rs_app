name: ci

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock
      PYTHON: python
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r backend/requirements-dev.txt

      - name: Lint
        run: make lint

      # Seed and tests run even when lint fails, so one red step does not hide the others.
      - name: Seed database
        if: ${{ !cancelled() }}
        run: make seed

      - name: Tests
        if: ${{ !cancelled() }}
        run: make test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.23.0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export
        run: pnpm build && test -f out/index.html

  # Pre-generated narratives replay byte for byte from the committed cache, without credentials or network.
  narratives:
    runs-on: ubuntu-latest
    env:
      LLM_PROVIDER: mock
      LOG_ENABLE_FILE: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-runtime.txt

      - name: Install runtime dependencies only
        run: python -m pip install -r backend/requirements-runtime.txt

      - name: Replay and compare
        working-directory: backend
        run: |
          python scripts/narratives.py generate
          python scripts/narratives.py check
          git diff --exit-code -- data/narratives

  # Builds the image and drives the running container over HTTP with no credentials at all (docs/DEPLOY.md).
  # Nothing is pushed anywhere.
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: trailsaga-demo:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image size
        run: |
          docker image inspect trailsaga-demo:ci --format '{{.Size}}' | awk '{printf "image size: %.0f MB\n", $1/1e6}'

      - name: Start container (no credentials)
        run: |
          docker run -d --name demo -p 8000:8000 trailsaga-demo:ci
          for i in $(seq 1 60); do
            status=$(docker inspect --format '{{.State.Health.Status}}' demo)
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker inspect --format 'health: {{.State.Health.Status}}' demo
          [ "$(docker inspect --format '{{.State.Health.Status}}' demo)" = healthy ]

      - name: Smoke test over HTTP
        run: python3 backend/scripts/smoke_container.py --base-url http://127.0.0.1:8000 --expect-offline

      - name: Container logs
        if: ${{ always() }}
        run: docker logs demo 2>&1 | tail -n 200
