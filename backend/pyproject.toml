[project]
name = "outdoor-rs-backend"
version = "0.1.0"
description = "FastAPI backend of the outdoor route recommender"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "UP007",  # `Optional[X]` / `Union[X, Y]` are fine; no churn to `X | None`
    "UP045",  # same, for Optional
    "B008",   # FastAPI `Depends(...)` in argument defaults is the framework's idiom
]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts", "pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
