[project]
name = "outdoor-rs-backend"
version = "0.1.0"
description = "FastAPI backend of the outdoor route recommender"
requires-python = ">=3.12"

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "UP007",  # `Optional[X]` / `Union[X, Y]` are fine; no churn to `X | None`
    "UP045",  # same, for Optional
    "B008",   # FastAPI `Depends(...)` in argument defaults is the framework's idiom
]

[tool.ruff.lint.per-file-ignores]
# Legacy modules made of long literal story / SVG / prompt text: reflowing would change the content.
"app/services/story_generator.py" = ["E501", "W291", "W293"]
"app/services/svg_templates.py" = ["E501", "W293"]
"scripts/mock_breakpoints.py" = ["E501"]
# Stand-alone scripts put the backend on sys.path before importing `app`.
"scripts/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["app", "scripts", "pipeline", "evalkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"
